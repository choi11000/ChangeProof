name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check app tests
      - run: pytest -m "not sandbox"
      - run: python -m compileall app

  backend-postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: changeproof_sandbox
          POSTGRES_USER: changeproof
          POSTGRES_PASSWORD: changeproof
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U changeproof -d changeproof_sandbox"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      REQUIRE_SANDBOX_TESTS: "true"
      SANDBOX_DATABASE_URL: postgresql+psycopg://changeproof:changeproof@localhost:5433/changeproof_sandbox
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest -m sandbox --no-cov

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npm audit

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t changeproof-api:ci apps/api
      - run: docker build -t changeproof-web:ci apps/web
      - run: docker compose --profile sandbox config
